<style>

<script>
(function(){
  'use strict';

  var TRANSPARENT_PNG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABpfZFQAAAAABJRU5ErkJggg==';
  var MARKETING_LINES=[
    'GROW YOUR BRAND',
    'CREATIVE • CONTENT • GROWTH',
    'PERFORMANCE THAT CONVERTS',
    'SOCIAL • SEARCH • STRATEGY',
    'MAKE YOUR BRAND UNMISSABLE',
    'TURN ATTENTION INTO GROWTH',
    'BUILD DEMAND. DRIVE RESULTS.',
    'STRATEGY FOR THE NEXT MOVE',
    'CREATIVE THAT SELLS',
    'BRANDS BUILT TO BE REMEMBERED'
  ];

  function makeJsonGlb(json){
    var bytes=new TextEncoder().encode(JSON.stringify(json));
    var padded=(bytes.length+3)&~3;
    var out=new Uint8Array(20+padded),dv=new DataView(out.buffer);
    dv.setUint32(0,0x46546c67,true);dv.setUint32(4,2,true);dv.setUint32(8,out.length,true);
    dv.setUint32(12,padded,true);dv.setUint32(16,0x4e4f534a,true);
    out.set(bytes,20);for(var i=20+bytes.length;i<out.length;i++)out[i]=0x20;
    return out;
  }

  function makeInvisibleVrm(){
    var bones=['hips','spine','head','leftUpperLeg','leftLowerLeg','leftFoot','rightUpperLeg','rightLowerLeg','rightFoot','leftUpperArm','leftLowerArm','leftHand','rightUpperArm','rightLowerArm','rightHand'];
    var nodes=[{name:'InvisibleRoot',children:[1]}];
    for(var i=0;i<bones.length;i++)nodes.push({name:bones[i]});
    nodes[1].children=[2,4,7];nodes[2].children=[3,10,13];nodes[4].children=[5];nodes[5].children=[6];nodes[7].children=[8];nodes[8].children=[9];nodes[10].children=[11];nodes[11].children=[12];nodes[13].children=[14];nodes[14].children=[15];
    var human={};for(var j=0;j<bones.length;j++)human[bones[j]]={node:j+1};
    return makeJsonGlb({asset:{version:'2.0',generator:'Seelary invisible avatar'},scene:0,scenes:[{nodes:[0]}],nodes:nodes,extensionsUsed:['VRMC_vrm'],extensionsRequired:['VRMC_vrm'],extensions:{VRMC_vrm:{specVersion:'1.0',humanoid:{humanBones:human},meta:{name:'Invisible',authors:['Seelary'],licenseUrl:'https://vrm.dev/licenses/1.0/'}}}});
  }

  function dataBytes(uri){var b=atob(uri.slice(uri.indexOf(',')+1)),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  var blankBytes=dataBytes(TRANSPARENT_PNG);
  var invisibleVrmBytes=makeInvisibleVrm();

  function rawUrl(v){try{return new URL(typeof v==='string'?v:(v&&v.url)||'',location.href)}catch(e){return null}}
  function kind(v){
    var u=rawUrl(v);if(!u)return '';
    var p=u.pathname.toLowerCase();
    if(/\/cyberfix\.glb$/.test(p))return 'city';
    if(/\.vrm$/.test(p))return 'vrm';
    if(/\/(?:assets\/)?bmfont\/[^/]+\.png$/.test(p))return 'blank';
    if(/\/(?:assets\/)?interaction\/[^/]+\.(?:png|svg)$/.test(p))return 'blank';
    if(/\/preloader\/[^/]+\.png$/.test(p))return 'blank';
    if(/\/front\/[^/]+\.svg$/.test(p))return 'blank';
    if(/\/(?:assets\/)?textures\/(?:atlasemoji|faces8|up)\.png$/.test(p))return 'blank';
    return '';
  }

  function makeMarketingPng(seed){
    var c=document.createElement('canvas');c.width=1024;c.height=512;
    var x=c.getContext('2d');
    x.fillStyle='#05070d';x.fillRect(0,0,1024,512);
    var g=x.createLinearGradient(0,0,1024,512);g.addColorStop(0,'rgba(255,0,92,.20)');g.addColorStop(.52,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,224,255,.18)');x.fillStyle=g;x.fillRect(0,0,1024,512);
    x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;
    for(var i=0;i<12;i++){var yy=18+i*42;x.beginPath();x.moveTo(0,yy);x.lineTo(1024,yy);x.stroke()}
    x.fillStyle='#ffffff';x.font='700 94px Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('SEELARY',512,150);
    x.fillStyle='#ff2b76';x.font='700 52px Arial, sans-serif';x.fillText('MARKETING',512,245);
    x.fillStyle='#c8f7ff';x.font='600 30px Arial, sans-serif';x.fillText(MARKETING_LINES[seed%MARKETING_LINES.length],512,333);
    x.fillStyle='rgba(255,255,255,.72)';x.font='500 21px Arial, sans-serif';x.fillText('STRATEGY  /  CREATIVE  /  PERFORMANCE',512,400);
    x.fillStyle='rgba(0,224,255,.85)';x.fillRect(104,454,300,5);x.fillStyle='rgba(255,43,118,.85)';x.fillRect(620,454,300,5);
    return c.toDataURL('image/png');
  }

  function sanitizeCityGlb(buffer){
    try{
      var src=new Uint8Array(buffer),dv=new DataView(buffer);
      if(src.length<20||dv.getUint32(0,true)!==0x46546c67||dv.getUint32(4,true)!==2)return src;

      var chunks=[],off=12,jsonIndex=-1,json=null;
      while(off+8<=src.length){
        var len=dv.getUint32(off,true),type=dv.getUint32(off+4,true),start=off+8,end=start+len;
        if(end>src.length)break;
        var data=src.slice(start,end);
        if(type===0x4e4f534a){jsonIndex=chunks.length;json=JSON.parse(new TextDecoder().decode(data).replace(/\u0000+$/,'').trim())}
        chunks.push({type:type,data:data});off=end;
      }
      if(!json||jsonIndex<0)return src;

      json.images=json.images||[];json.textures=json.textures||[];json.materials=json.materials||[];
      var cjk=/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af]/;
      var signWords=/(?:text|font|glyph|letter|word|label|caption|title|logo|sign|signage|kanji|hanzi|chinese|japanese|korean|poster|banner|billboard|decal|sticker|graffiti|typograph|advert|adboard|shop.?name|store.?name|neon.?sign|symbol|icon|screen|display|panel|board)/i;

      function descriptor(o){var s='';if(!o)return s;if(typeof o.name==='string')s+=' '+o.name;if(typeof o.uri==='string')s+=' '+o.uri;try{if(o.extras)s+=' '+JSON.stringify(o.extras)}catch(e){}return s}
      function namedSign(o){var s=descriptor(o);return !!s&&(cjk.test(s)||signWords.test(s))}
      function clone(v){return v?JSON.parse(JSON.stringify(v)):v}
      function max3(v){return Array.isArray(v)?Math.max(v[0]||0,v[1]||0,v[2]||0):0}

      var materialUsage=[];
      (json.meshes||[]).forEach(function(m){(m.primitives||[]).forEach(function(p){if(Number.isInteger(p.material))materialUsage[p.material]=(materialUsage[p.material]||0)+1})});

      var meshSignMaterials=new Set();
      (json.meshes||[]).forEach(function(m){if(!namedSign(m))return;(m.primitives||[]).forEach(function(p){if(Number.isInteger(p.material))meshSignMaterials.add(p.material)})});
      (json.nodes||[]).forEach(function(n){if(!namedSign(n)||!Number.isInteger(n.mesh))return;var m=json.meshes&&json.meshes[n.mesh];(m&&m.primitives||[]).forEach(function(p){if(Number.isInteger(p.material))meshSignMaterials.add(p.material)})});

      var candidates=[];
      json.materials.forEach(function(m,mi){
        if(!m)return;
        var pbr=m.pbrMetallicRoughness||{};
        var dedicated=(materialUsage[mi]||0)<=2;
        var emissive=!!m.emissiveTexture||max3(m.emissiveFactor)>.18;
        var textured=!!m.emissiveTexture||!!pbr.baseColorTexture;
        if(namedSign(m)||meshSignMaterials.has(mi)||(dedicated&&emissive&&textured))candidates.push(mi);
      });

      var report=[];
      candidates.forEach(function(mi,n){
        var m=json.materials[mi];if(!m)return;
        var pbr=m.pbrMetallicRoughness||(m.pbrMetallicRoughness={});
        var originalInfo=m.emissiveTexture||pbr.baseColorTexture||null;
        var oldTexture=originalInfo&&json.textures[originalInfo.index];
        var imgIndex=json.images.length;
        json.images.push({name:'Seelary Marketing '+(n+1),uri:makeMarketingPng(n),mimeType:'image/png'});
        var tex={source:imgIndex};
        if(oldTexture&&Number.isInteger(oldTexture.sampler))tex.sampler=oldTexture.sampler;
        var texIndex=json.textures.length;json.textures.push(tex);

        var replacementInfo=originalInfo?clone(originalInfo):{};replacementInfo.index=texIndex;
        pbr.baseColorTexture=clone(replacementInfo);
        m.emissiveTexture=clone(replacementInfo);
        pbr.baseColorFactor=[1,1,1,1];m.emissiveFactor=[1,1,1];m.alphaMode='OPAQUE';
        report.push({material:mi,name:m.name||('#'+mi),texture:texIndex,image:imgIndex});
      });

      window.__seelaryMarketingSigns=report;
      console.info('[Seelary] marketing panels installed:',report.length,report);

      /* The scene graph, nodes, meshes, primitives, buffers and original shared images remain untouched. */
      var enc=new TextEncoder().encode(JSON.stringify(json)),pad=(enc.length+3)&~3,jsonData=new Uint8Array(pad);
      jsonData.fill(0x20);jsonData.set(enc);chunks[jsonIndex].data=jsonData;
      var total=12;chunks.forEach(function(c){total+=8+c.data.length});
      var out=new Uint8Array(total),odv=new DataView(out.buffer),pos=12;
      odv.setUint32(0,0x46546c67,true);odv.setUint32(4,2,true);odv.setUint32(8,total,true);
      chunks.forEach(function(c){odv.setUint32(pos,c.data.length,true);odv.setUint32(pos+4,c.type,true);out.set(c.data,pos+8);pos+=8+c.data.length});
      return out;
    }catch(e){console.warn('[Seelary] marketing replacement skipped; original city kept.',e);return new Uint8Array(buffer)}
  }

  try{var q=JSON.parse(localStorage.getItem('smsy_quests'))||{};q.TUTORIAL=true;localStorage.setItem('smsy_quests',JSON.stringify(q))}catch(e){}
  (function(){var p=new URLSearchParams(location.search),changed=false;if(p.get('forceWebGL')!=='true'){p.set('forceWebGL','true');changed=true}if(p.get('cdn')!=='false'){p.set('cdn','false');changed=true}if(changed)location.replace(location.pathname+'?'+p.toString()+location.hash)})();

  if(window.fetch){
    var nativeFetch=window.fetch.bind(window);
    window.fetch=function(input,init){
      var k=kind(input);
      if(k==='vrm')return Promise.resolve(new Response(invisibleVrmBytes,{status:200,headers:{'Content-Type':'model/gltf-binary'}}));
      if(k==='blank')return Promise.resolve(new Response(blankBytes,{status:200,headers:{'Content-Type':'image/png'}}));
      if(k==='city')return nativeFetch(input,init).then(function(r){if(!r.ok)return r;return r.arrayBuffer().then(function(b){var clean=sanitizeCityGlb(b),h=new Headers(r.headers);h.delete('content-length');h.set('content-type','model/gltf-binary');return new Response(clean,{status:r.status,statusText:r.statusText,headers:h})})});
      return nativeFetch(input,init);
    };
  }

  if(window.XMLHttpRequest){
    var nativeOpen=XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open=function(method,url){var k=kind(url);if(k==='vrm')arguments[1]=URL.createObjectURL(new Blob([invisibleVrmBytes],{type:'model/gltf-binary'}));else if(k==='blank')arguments[1]=TRANSPARENT_PNG;return nativeOpen.apply(this,arguments)};
  }

  function patchSrc(proto){if(!proto)return;var d=Object.getOwnPropertyDescriptor(proto,'src');if(!d||!d.set)return;Object.defineProperty(proto,'src',{configurable:true,enumerable:d.enumerable,get:d.get,set:function(v){if(kind(v)==='blank')v=TRANSPARENT_PNG;d.set.call(this,v)}})}
  patchSrc(window.HTMLImageElement&&HTMLImageElement.prototype);

  if(window.WebSocket){
    var NativeWebSocket=window.WebSocket;
    function SilentSocket(url){var self=this;this.url=String(url||'');this.readyState=0;this.bufferedAmount=0;this.extensions='';this.protocol='';this.binaryType='blob';this._listeners={};this.onopen=this.onmessage=this.onerror=this.onclose=null;setTimeout(function(){if(self.readyState===0){self.readyState=1;self._emit('open',{type:'open',target:self,currentTarget:self})}},0)}
    SilentSocket.prototype.addEventListener=function(t,f){if(typeof f==='function')(this._listeners[t]||(this._listeners[t]=[])).push(f)};
    SilentSocket.prototype.removeEventListener=function(t,f){var a=this._listeners[t]||[],i=a.indexOf(f);if(i>=0)a.splice(i,1)};
    SilentSocket.prototype._emit=function(t,e){var h=this['on'+t];if(typeof h==='function')try{h.call(this,e)}catch(x){};(this._listeners[t]||[]).slice().forEach(function(f){try{f.call(this,e)}catch(x){}},this)};
    SilentSocket.prototype.send=function(){};
    SilentSocket.prototype.close=function(code,reason){if(this.readyState===3)return;this.readyState=3;this._emit('close',{type:'close',target:this,currentTarget:this,code:code||1000,reason:reason||'',wasClean:true})};
    window.WebSocket=new Proxy(NativeWebSocket,{construct:function(T,args){var u=String(args[0]||'');return u.indexOf('samsy.partykit.dev')!==-1?new SilentSocket(u):Reflect.construct(T,args)},apply:function(T,x,args){return Reflect.apply(T,x,args)}});
  }

  function purgeHud(){
    var app=document.getElementById('app');
    if(app){var canvases=app.querySelectorAll('canvas');for(var i=0;i<canvases.length;i++)document.body.appendChild(canvases[i]);app.style.setProperty('display','none','important')}
    ['#preloader','#topmenu','#tutorial','#soundtoggle','#works-container','#works','#about','.notification-wrapper','.title-container','.overlay','.infos','.close-infos','#seelay-brand'].forEach(function(s){document.querySelectorAll(s).forEach(function(el){el.style.setProperty('display','none','important')})});
  }
  document.addEventListener('DOMContentLoaded',function(){purgeHud();new MutationObserver(purgeHud).observe(document.body,{childList:true,subtree:true})},{once:true});
})();
