<!DOCTYPE html>
<html lang="en">

    <head>

         <meta charset="UTF-8">
         <title>Seelay</title>

         <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">

         <meta name="description" content="Seelay interactive 3D portfolio experience.">
         <meta name="author" content="Seelay">
         <meta name="theme-color" content="#000000">
         <meta name="msapplication-TileColor" content="#000000">
         <meta name="apple-mobile-web-app-capable" content="yes">
         <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

         <link rel="icon" type="image/x-icon" href="./favicons/favicon.ico">
         <link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
         <link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
         <link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
         <link rel="icon" type="image/png" sizes="192x192" href="./favicons/android-chrome-192x192.png">
         <link rel="icon" type="image/png" sizes="512x512" href="./favicons/android-chrome-512x512.png">

         <link rel="stylesheet" href="https://use.typekit.net/twe8lcf.css">

         <style>
           /* Seelay cleanup layer: keep the 3D canvas, remove the old mascot/UI chrome. */
           #preloader,
           #topmenu,
           #tutorial,
           .notification-wrapper,
           #smsy,
           .tm {
             display: none !important;
             visibility: hidden !important;
             opacity: 0 !important;
             pointer-events: none !important;
           }

           #seelay-brand {
             position: fixed;
             top: 38px;
             left: 50%;
             transform: translateX(-50%);
             z-index: 1000001;
             color: #fff;
             font-family: forma-djr-display, sans-serif;
             font-size: 18px;
             font-weight: 600;
             letter-spacing: .08em;
             line-height: 1;
             text-transform: none;
             pointer-events: none;
             user-select: none;
             white-space: nowrap;
           }

           .mobile #seelay-brand {
             top: 20px;
             font-size: 16px;
           }
         </style>

         <script>
         /* Skip the captured tutorial and use the local media/backend path. */
         try {
           var q = JSON.parse(localStorage.getItem('smsy_quests')) || {};
           q.TUTORIAL = true;
           localStorage.setItem('smsy_quests', JSON.stringify(q));
         } catch (e) {}

         (function () {
           var p = new URLSearchParams(window.location.search);
           var changed = false;
           if (p.get('forceWebGL') !== 'true') {
             p.set('forceWebGL', 'true');
             changed = true;
           }
           if (p.get('cdn') !== 'false') {
             p.set('cdn', 'false');
             changed = true;
           }
           if (changed) {
             window.location.replace(window.location.pathname + '?' + p.toString() + window.location.hash);
           }
         })();

         /*
          * The captured cat/VRM characters represent multiplayer peers.
          * Keep WebSocket available for everything else, but provide a silent
          * local socket for the Samsy PartyKit room so no remote avatars spawn.
          */
         (function () {
           if (!window.WebSocket) return;

           var NativeWebSocket = window.WebSocket;

           function SilentSocket(url) {
             var self = this;
             this.url = String(url || '');
             this.readyState = 0;
             this.bufferedAmount = 0;
             this.extensions = '';
             this.protocol = '';
             this.binaryType = 'blob';
             this.onopen = null;
             this.onmessage = null;
             this.onerror = null;
             this.onclose = null;
             this._listeners = Object.create(null);

             setTimeout(function () {
               if (self.readyState !== 0) return;
               self.readyState = 1;
               var event = { type: 'open', target: self, currentTarget: self };
               self._emit('open', event);
             }, 0);
           }

           SilentSocket.prototype.addEventListener = function (type, fn) {
             if (typeof fn !== 'function') return;
             (this._listeners[type] || (this._listeners[type] = [])).push(fn);
           };

           SilentSocket.prototype.removeEventListener = function (type, fn) {
             var list = this._listeners[type];
             if (!list) return;
             var i = list.indexOf(fn);
             if (i >= 0) list.splice(i, 1);
           };

           SilentSocket.prototype._emit = function (type, event) {
             var handler = this['on' + type];
             if (typeof handler === 'function') {
               try { handler.call(this, event); } catch (e) {}
             }
             var list = (this._listeners[type] || []).slice();
             for (var i = 0; i < list.length; i++) {
               try { list[i].call(this, event); } catch (e) {}
             }
           };

           SilentSocket.prototype.send = function () {};

           SilentSocket.prototype.close = function (code, reason) {
             if (this.readyState === 3) return;
             this.readyState = 3;
             this._emit('close', {
               type: 'close',
               target: this,
               currentTarget: this,
               code: code || 1000,
               reason: reason || '',
               wasClean: true
             });
           };

           window.WebSocket = new Proxy(NativeWebSocket, {
             construct: function (Target, args) {
               var url = String(args[0] || '');
               if (url.indexOf('samsy.partykit.dev') !== -1) {
                 return new SilentSocket(url);
               }
               return Reflect.construct(Target, args);
             },
             apply: function (Target, thisArg, args) {
               return Reflect.apply(Target, thisArg, args);
             }
           });
         })();

         /* Remove CJK text and legacy SMSY text whenever Vue mounts/updates UI. */
         (function () {
           var cjk = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g;
           var legacyBrand = /SMSY(?:-Gen02)?/gi;

           function cleanTextNode(node) {
             if (!node || node.nodeType !== 3 || !node.parentNode) return;
             var tag = node.parentNode.nodeName;
             if (tag === 'SCRIPT' || tag === 'STYLE') return;
             var value = node.nodeValue || '';
             var cleaned = value.replace(cjk, '').replace(legacyBrand, 'Seelay');
             if (cleaned !== value) node.nodeValue = cleaned;
           }

           function cleanTree(root) {
             if (!root) return;
             if (root.nodeType === 3) {
               cleanTextNode(root);
               return;
             }
             if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;

             var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
             var node;
             while ((node = walker.nextNode())) cleanTextNode(node);
           }

           function startCleaner() {
             cleanTree(document.body);
             var observer = new MutationObserver(function (mutations) {
               for (var i = 0; i < mutations.length; i++) {
                 var m = mutations[i];
                 if (m.type === 'characterData') cleanTextNode(m.target);
                 for (var j = 0; j < m.addedNodes.length; j++) cleanTree(m.addedNodes[j]);
               }
             });
             observer.observe(document.body, {
               childList: true,
               subtree: true,
               characterData: true
             });
           }

           if (document.readyState === 'loading') {
             document.addEventListener('DOMContentLoaded', startCleaner, { once: true });
           } else {
             startCleaner();
           }
         })();
         </script>

         <script type="module" crossorigin src="./assets/js/main-ITpbzWAg.js"></script>
         <link rel="stylesheet" crossorigin href="./assets/css/main-rb3R8F1q.css">
   </head>

    <body>

       <div id="preloader"></div>
       <div id="app"></div>
       <div id="seelay-brand" aria-label="Seelay">Seelay</div>

    </body>
</html>
